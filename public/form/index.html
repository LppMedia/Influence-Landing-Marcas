<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto | LPP Media Influence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #05010a; /* Tu color de fondo oscuro */
            color: #94a3b8; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-text {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.5rem;
            text-decoration: none;
            margin-bottom: 10px;
            display: inline-block;
        }
        .form-container { 
            width: 100%; 
            max-width: 600px; /* Ancho máximo para que se vea elegante */
            background: #ffffff; /* Fondo blanco para que el formulario resalte y sea legible */
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(208, 24, 253, 0.2); /* Tu color morado en la sombra */
        }
        iframe {
            width: 100%;
            height: 800px; /* Altura suficiente para el formulario */
            border: none;
            overflow: hidden;
        }
        .back-btn {
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-btn:hover {
            color: #d018fd;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="/" class="logo-text">LPP Media Influence</a>
    </div>

    <div class="form-container">
        <iframe 
            src="https://api.leadconnectorhq.com/widget/form/PTPnv8nOhAmUIGswpMZq" 
            id="ghl-form"
            scrolling="no">
        </iframe>
    </div>

    <a href="/" class="back-btn">← Volver al Inicio</a>

    <script>
        // Script pequeño para intentar ajustar la altura automáticamente si el formulario cambia
        const iframe = document.getElementById("ghl-form");
        window.addEventListener('message', function(event) {
            if(event.data.type === 'setHeight') {
                iframe.style.height = event.data.value + 'px';
            }
        });
    </script>
</body>
</html>
