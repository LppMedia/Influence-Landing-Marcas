    <style>
      :root {
        --brand-magenta: #d018fd;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #05010a;
        color: white;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* Lenis Scroll Smooth Fixes */
      html.lenis {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }

      .glass {
        background: rgba(5, 1, 10, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .marquee-text-style {
        fill: white;
        font-size: 64px;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        font-weight: 900;
        opacity: 0.1;
      }

      @keyframes shine-streak {
        0% { transform: translateX(-100%) rotate(25deg); }
        20%, 100% { transform: translateX(200%) rotate(25deg); }
      }
      .btn-shiny {
        position: relative;
        overflow: hidden;
      }
      .btn-shiny::after {
        content: '';
        position: absolute;
        top: -50%;
        left: 0;
        width: 40%;
        height: 200%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
        animation: shine-streak 4s infinite ease-in-out;
      }

      /* Brillos de fondo optimizados */
      .bg-glow {
        position: fixed;
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, rgba(208, 24, 253, 0.08) 0%, transparent 70%);
        filter: blur(80px);
        pointer-events: none;
        z-index: -1;
      }
    </style>
